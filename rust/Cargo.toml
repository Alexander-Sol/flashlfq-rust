[workspace]
resolver = "2"
members = [
    "flashlfq-core",
    "flashlfq-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["mzLib contributors"]
repository = "https://github.com/smith-chem-wisc/mzLib"

# Shared dependency versions live here so the core and bindings crates stay in lockstep.
# Arrow/pyarrow ABI pairing (P0.4): arrow 54.x is the last release line that pins
# `pyo3 = "^0.23"` behind its `pyarrow` feature — arrow 55+ moves to pyo3 0.24+, which would
# clash with our pinned pyo3 0.23.5. So arrow 54 ↔ pyo3 0.23 is the compatible pair.
# Resolved at build time to arrow 54.3.1. The Rust↔pyarrow handoff rides the Arrow C Data
# Interface (ABI-stable), so any reasonably recent pyarrow (>= 14) reads the table; the
# end-to-end pyarrow import is verified in P0.5 (needs maturin).
[workspace.dependencies]
pyo3 = { version = "0.23", default-features = false }
numpy = "0.23"
arrow = "54"
# Data-parallelism for the untargeted detector's intra-file red-black RT binning (opt-in via
# `DETECT_PARALLEL`; the default detect path stays single-threaded and bit-for-bit unchanged).
rayon = "1.10"
